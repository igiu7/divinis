plugins {
    id "architectury-plugin" version "3.5.170"
    id "dev.architectury.loom" version "1.17.493" apply false
    id "com.gradleup.shadow" version "9.6.1" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = project.mod_group_id
    version = project.mod_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = "${rootProject.mod_id}-${project.name}"
    }

    repositories {
        maven {
            url "https://maven.ftb.dev/releases"
            content { includeGroup "dev.ftb.mods" }
        }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.parchmentmc.org" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven {
            url "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
        mavenCentral()
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.parchment_minecraft_version}:${rootProject.parchment_mappings_version}@zip")
        }
        compileOnly "com.google.code.findbugs:jsr305:3.0.2" // @Nullable
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = "UTF-8"
    }
}
