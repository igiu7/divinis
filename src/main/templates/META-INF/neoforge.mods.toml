modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="igiu7"
description='''
The RPG: bosses, dungeons and the Labyrinth, fishing, the character with its skill trees and skill books,
smithing at the forge, the rare metals with their weapons, armour and tools, and the Guild Master's quests.
'''

